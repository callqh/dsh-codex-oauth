<path d="M78 1101 Q 905 1095 1720 1100" stroke="#283d49" stroke-width="2" fill="none"/>
<path d="M98 1134 l57 -1" class="flow"/><text class="small" x="169" y="1140">调用 / 数据读取</text>
<path d="M413 1134 l57 -1" class="ownership"/><text class="small" x="486" y="1140">凭证由上游写入</text>
